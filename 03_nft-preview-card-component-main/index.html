<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Equilibrium NFT Card</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

    <!-- Outer light background -->
    <div class="outer-wrapper">

        <!-- Dark background section -->
        <div class="dark-section">

            <!-- Card -->
            <div class="card">

                <div class="image-section">
                    <img src="/design files/images/image-equilibrium.jpg" alt="Equilibrium Cube">
                </div>

                <div class="content">
                    <h2>Equilibrium #3429</h2>

                    <p class="description">
                        Our Equilibrium collection promotes balance and calm.
                    </p>

                    <div class="info">
                        <div class="price">
                            <span>♦</span> 0.041 ETH
                        </div>

                        <div class="time">
                            ⏱ 3 days left
                        </div>
                    </div>

                    <hr>

                    <div class="creator">
                        <img src="/design files/images/image-avatar.png" alt="Creator">
                        <p>Creation of <span>Jules Wyvern</span></p>
                    </div>
                </div>

            </div>

        </div>
    </div>

</body>
</html>
